# ==========================================================
# Render Infrastructure Blueprint: SportZone E-Commerce
# Project: Spring Boot 3 (Backend) + React Vite (Frontend) + PostgreSQL
# ==========================================================

databases:
  # --------------------------------------------------------
  # Managed PostgreSQL Cloud Database
  # --------------------------------------------------------
  - name: sportzone-postgres
    databaseName: sportzone_db
    user: sportzone_user
    plan: free
    region: oregon

services:
  # --------------------------------------------------------
  # 1. SportZone Backend (Spring Boot 3 Docker Web Service)
  # --------------------------------------------------------
  - type: web
    name: sportzone-backend
    runtime: docker
    rootDir: sportzone/backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sportzone-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://sportzone-frontend.onrender.com,https://*.onrender.com,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true

  # --------------------------------------------------------
  # 2. SportZone Frontend (React 18 + Vite Static Site)
  # --------------------------------------------------------
  - type: web
    name: sportzone-frontend
    runtime: static
    rootDir: sportzone/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      # SPA Rewrite Rule to route all requests to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sportzone-backend
          property: host
