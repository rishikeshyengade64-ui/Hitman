# ==========================================================
# Application Configuration: SportZone E-Commerce Backend
# ==========================================================
spring.application.name=sportzone-backend
server.port=${PORT:8080}
server.address=0.0.0.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ----------------------------------------------------------
# Microsoft SQL Server (MSSQL) Datasource Configuration
# ----------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sportzone_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrong!Passw0rd

# ----------------------------------------------------------
# JPA / Hibernate Configuration (Dialect auto-detected by Hibernate 6)
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------
# Flyway Database Migrations
# ----------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ----------------------------------------------------------
# JWT Security Configuration
# ----------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# CORS Configuration
# ----------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
