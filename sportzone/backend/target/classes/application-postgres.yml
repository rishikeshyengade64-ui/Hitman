# ==========================================================
# Spring Boot Configuration: PostgreSQL (Render Production)
# ==========================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # The URL, username, and password can be specified directly or automatically
    # converted from Render's DATABASE_URL via DatabaseConfig.java
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sportzone_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: SportZonePostgresPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    # Flyway MSSQL migrations are bypassed in postgres profile; JPA handles schema auto-update
    enabled: ${SPRING_FLYWAY_ENABLED:false}

# JWT Token Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:5173,http://127.0.0.1:5173}
